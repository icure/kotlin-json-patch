name: Test

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        name: Run the tests
        runs-on: ubuntu-latest
        steps:
            -   name: Check out code
                uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: 21
                    cache: 'gradle'

            # Apple and Windows targets are skipped on Linux (kotlin.native.ignoreDisabledTargets); they are
            # compiled by the release workflow on the macOS runner.
            -   name: Run the tests
                run: ./gradlew jvmTest testAndroidHostTest jsNodeTest linuxX64Test
